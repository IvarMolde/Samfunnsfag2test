name: Kontroll

on:
  push:
  pull_request:

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Kontroller spørsmålsfilen
        run: npm run validate

      - name: Kontroller at questions.xml stemmer med kilden
        run: |
          npm run appxml
          git diff --exit-code questions.xml

      - name: Enhetstester
        run: npm test

      - name: Installer nettleser
        run: npx playwright-core install --with-deps chromium

      - name: Ende-til-ende-tester
        run: npm run e2e
