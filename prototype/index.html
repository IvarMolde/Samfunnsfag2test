        <riktig>Riktig. Det er vanlig å gå til kontroll hos tannlegen én gang i året.</riktig>

    <sporsmal id="helse-58" emne="Tannhelse">

      </tilbakemelding>

    <sporsmal id="helse-59" emne="Tannhelse">

      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-60" emne="Tannhelse">

      <svar>Tannlegen</svar>

      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-61" emne="Tannhelse">

      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-62" emne="Tannhelse">

    <sporsmal id="helse-63" emne="Tannhelse">

    <sporsmal id="helse-64" emne="Tannhelse">

    <sporsmal id="helse-65" emne="Å flytte til et nytt land">
      <tekst>Hvor mange faser har den psykiske migrasjonsprosessen?</tekst>
      <svar riktig="true">Tre faser</svar>
      <svar>To faser</svar>
      <svar>Fem faser</svar>
      <tilbakemelding>
        <riktig>Riktig. Den psykiske migrasjonsprosessen har tre faser.</riktig>
        <feil>Mange som flytter, går gjennom tre faser: først glede, så en vanskelig tid, og så blir livet lettere.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-66" emne="Å flytte til et nytt land">
      <tekst>Hva er vanlig å føle i den første tiden etter flyttingen?</tekst>
      <svar riktig="true">Glede og optimisme</svar>
      <svar>Sorg og savn</svar>
      <svar>Sinne og frykt</svar>
      <tilbakemelding>
        <riktig>Riktig. Den første tiden er det vanlig å føle seg glad og optimistisk. Alt det nye er spennende.</riktig>
        <feil>I fase 1 tenker man mest på nye muligheter. Man er ofte glad og har det travelt.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-67" emne="Å flytte til et nytt land">
      <tekst>Hva skjer ofte i fase 2 av migrasjonsprosessen?</tekst>
      <svar riktig="true">Livet føles vanskelig, og savnet blir stort</svar>
      <svar>Man føler seg glad og har det travelt</svar>
      <svar>Man har funnet sin plass i det nye samfunnet</svar>
      <tilbakemelding>
        <riktig>Riktig. I fase 2 føles livet vanskelig. Man savner livet slik det var før.</riktig>
        <feil>I fase 2 forstår man hva flyttingen betyr. Mange blir slitne og savner hjemlandet.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-68" emne="Å flytte til et nytt land">
      <tekst>Hva skjer ofte i fase 3 av migrasjonsprosessen?</tekst>
      <svar riktig="true">Livet føles lettere, og man forstår mer</svar>
      <svar>Man savner hjemlandet mer enn før</svar>
      <svar>Man tenker mest på nye muligheter</svar>
      <tilbakemelding>
        <riktig>Riktig. I fase 3 føles livet lettere. Man forstår mer av språket og systemet.</riktig>
        <feil>I fase 3 har man akseptert flyttingen. Framtiden ser lysere ut.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-69" emne="Å flytte til et nytt land">
      <tekst>Hvor lenge varer hver fase i migrasjonsprosessen?</tekst>
      <svar riktig="true">Det er ulikt fra person til person</svar>
      <svar>Hver fase varer i nøyaktig tolv måneder</svar>
      <svar>Hver fase varer i omtrent én uke</svar>
      <tilbakemelding>
        <riktig>Riktig. Hvor lenge fasene varer, er forskjellig fra menneske til menneske.</riktig>
        <feil>Fasene har ingen fast lengde. For noen går det fort, for andre tar det lang tid.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-70" emne="Å flytte til et nytt land">
      <tekst>Amaniel er sliten og savner familien etter noen uker. Hvilken fase er han i?</tekst>
      <svar riktig="true">Fase 2</svar>
      <svar>Fase 1</svar>
      <svar>Fase 3</svar>
      <tilbakemelding>
        <riktig>Riktig. Amaniel er i fase 2. Han er sliten og savner det han har mistet.</riktig>
        <feil>Når man er sliten og savner livet før, er man i fase 2.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-71" emne="Å flytte til et nytt land">
      <tekst>Hva hjelper en innvandrer å finne sin plass i det nye samfunnet?</tekst>
      <svar riktig="true">Å kombinere nye og gamle verdier</svar>
      <svar>Å glemme kulturen fra hjemlandet</svar>
      <svar>Å leve akkurat som i hjemlandet</svar>
      <tilbakemelding>
        <riktig>Riktig. Man finner sin plass når man kombinerer det positive i det nye landet med verdier fra hjemlandet.</riktig>
        <feil>Du trenger ikke glemme hvem du er. Mange finner sin plass ved å kombinere det nye og det gamle.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-72" emne="Å flytte til et nytt land">
      <tekst>Hva er vanlig i en familie som har flyttet til et nytt land?</tekst>
      <svar riktig="true">Familiemedlemmene kan være i ulike faser</svar>
      <svar>Hele familien går gjennom fasene likt</svar>
      <svar>Barna merker ingenting av flyttingen</svar>
      <tilbakemelding>
        <riktig>Riktig. Ulike familiemedlemmer kan være i ulike faser til ulike tider.</riktig>
        <feil>Alle reagerer ikke likt. Barn og voksne i samme familie kan være i ulike faser.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-73" emne="Identitet">
      <tekst>Hva betyr identitet?</tekst>
      <svar riktig="true">Hvordan vi oppfatter oss selv</svar>
      <svar>Hvor mye penger vi tjener</svar>
      <svar>Hvilket pass vi har</svar>
      <tilbakemelding>
        <riktig>Riktig. Identitet er hvordan vi oppfatter oss selv.</riktig>
        <feil>Identitet handler om hvem du er og hvordan du ser på deg selv.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-74" emne="Identitet">
      <tekst>Hva er med på å forme identiteten vår?</tekst>
      <svar riktig="true">Personlighet, interesser og venner</svar>
      <svar>Blodtypen og øyefargen vi er født med</svar>
      <svar>Hvor høye og sterke vi er som voksne</svar>
      <tilbakemelding>
        <riktig>Riktig. Identiteten formes av egenskaper og personlighet, og av hvor vi bor, hvem vi er sammen med og interessene våre.</riktig>
        <feil>Identiteten handler om personlighet og om livet vi lever, for eksempel venner og interesser.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-75" emne="Identitet">
      <tekst>Hva forteller noe om en persons seksuelle identitet?</tekst>
      <svar riktig="true">Hvem personen blir forelsket i</svar>
      <svar>Hvilke klær personen liker</svar>
      <svar>Hvilket kjønn personen er født med</svar>
      <tilbakemelding>
        <riktig>Riktig. Hvem man blir forelsket i og tiltrukket av, sier noe om seksuell identitet.</riktig>
        <feil>Seksuell identitet handler om hvem man blir forelsket i.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-76" emne="Identitet">
      <tekst>Hva kaller vi måten en person viser kjønn på, for eksempel med klær?</tekst>
      <svar riktig="true">Kjønnsuttrykk</svar>
      <svar>Seksuell legning</svar>
      <svar>Kjønnsrolle</svar>
      <tilbakemelding>
        <riktig>Riktig. Hvordan man kler seg eller på andre måter viser kjønn, kaller vi kjønnsuttrykk.</riktig>
        <feil>Kjønnsuttrykk er hvordan du viser kjønn utad, for eksempel med klær, hår eller sminke.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-77" emne="Identitet">
      <tekst>Hva betyr kjønnsidentitet?</tekst>
      <svar riktig="true">Hvilket kjønn en person føler seg som</svar>
      <svar>Hvem en person blir forelsket i</svar>
      <svar>Hvilke klær en person bruker</svar>
      <tilbakemelding>
        <riktig>Riktig. Kjønnsidentitet er hvilket kjønn en person opplever å være.</riktig>
        <feil>Kjønnsidentitet handler om hvordan du selv opplever kjønnet ditt.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-78" emne="Identitet">
      <tekst>Hva er det større åpenhet for i Norge i dag enn før?</tekst>
      <svar riktig="true">At ikke alle passer inn i gutt eller jente</svar>
      <svar>At alle må være enten gutt eller jente</svar>
      <svar>At kjønnsrollene alltid skal være like</svar>
      <tilbakemelding>
        <riktig>Riktig. I dag er det større åpenhet for at ikke alle føler seg som gutt eller jente.</riktig>
        <feil>Før delte man kjønn i to. Nå er det mer åpenhet for at noen opplever kjønn på en annen måte.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-79" emne="Identitet">
      <tekst>Hva betyr heteroseksuell?</tekst>
      <svar riktig="true">Å bli forelsket i en av motsatt kjønn</svar>
      <svar>Å bli forelsket i en av samme kjønn</svar>
      <svar>Å ikke bli forelsket i noen</svar>
      <tilbakemelding>
        <riktig>Riktig. Heteroseksuell betyr at man blir forelsket i personer av motsatt kjønn.</riktig>
        <feil>Hetero betyr ulik. En heteroseksuell blir forelsket i en av motsatt kjønn.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="helse-80" emne="Identitet">
      <tekst>Hva sier norsk lov om diskriminering på grunn av seksuell orientering?</tekst>
      <svar riktig="true">Det er forbudt i loven</svar>
      <svar>Det er lov for arbeidsgivere</svar>
      <svar>Det er lov for utleiere av bolig</svar>
      <tilbakemelding>
        <riktig>Riktig. Likestillings- og diskrimineringsloven forbyr diskriminering på grunn av seksuell orientering, kjønnsidentitet og kjønnsuttrykk.</riktig>
        <feil>Loven sier at ingen skal behandles dårligere på grunn av hvem de blir forelsket i. Det gjelder også på jobb og i boligmarkedet.</feil>
      </tilbakemelding>
    </sporsmal>

    <sporsmal id="okonomi-01" emne="Personlig økonomi">

      <svar>Penger vi har spart på en egen konto</svar>
      <tilbakemelding>
        <riktig>Riktig. Utgifter er alt vi bruker penger på, som husleie, mat, strøm og klær.</riktig>
        <feil>Penger som kommer inn, som lønn og trygd, er inntekter. Utgifter er penger som går ut.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="okonomi-02" emne="Personlig økonomi">

      <svar>Lønnen før skatten er trukket</svar>
      <svar>Lønnen for overtid og arbeid i helgene</svar>
      <tilbakemelding>
        <riktig>Riktig. Nettolønn er det du får på kontoen etter at skatten er trukket.</riktig>
        <feil>Lønn før skatt heter bruttolønn. Nettolønn er det som er igjen etter skatt.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="okonomi-03" emne="Personlig økonomi">
      <tekst>Hva er et budsjett?</tekst>
      <svar riktig="true">En plan for inntekter og utgifter</svar>
      <svar>En liste over alt du eier og skylder</svar>
      <svar>Et brev fra banken om lånet</svar>

        <riktig>Riktig. Et budsjett viser inntekter og utgifter i en periode, for eksempel en måned.</riktig>

      </tilbakemelding>
    </sporsmal>
    <sporsmal id="okonomi-04" emne="Personlig økonomi">

      </tilbakemelding>

    <sporsmal id="okonomi-05" emne="Personlig økonomi">

        <feil>Det er dyrt å bo i Norge. Bolig er den største utgiften for de fleste.</feil>
      </tilbakemelding>

    <sporsmal id="okonomi-06" emne="Personlig økonomi">

    <sporsmal id="okonomi-07" emne="Personlig økonomi">

    <sporsmal id="okonomi-08" emne="Personlig økonomi">

      <svar>Adresse og telefonnummer</svar>

      </tilbakemelding>

    <sporsmal id="okonomi-11" emne="Personlig økonomi">
      <tekst>Hva er renter på et lån?</tekst>
      <svar riktig="true">Prisen du betaler for å låne penger</svar>
      <svar>Den delen av lånet du betaler ned</svar>
      <svar>Et gebyr for å åpne en bankkonto</svar>

    <sporsmal id="okonomi-12" emne="Personlig økonomi">

      <svar>Penger banken gir deg når du sparer</svar>

    <sporsmal id="okonomi-53" emne="Bolig">

    <sporsmal id="okonomi-61" emne="Bolig">

    <sporsmal id="frihet-01" emne="Vold i nære relasjoner">
      <tekst>Hva betyr «vold i nære relasjoner»?</tekst>

      <svar>Vold mellom fremmede mennesker ute på gaten</svar>
      <svar>Vold mellom spillere under en kamp i idrett</svar>
      <tilbakemelding>
        <riktig>Riktig. Vold i nære relasjoner er vold mellom familiemedlemmer, partnere eller andre som står hverandre nær. Det gjelder også vold mellom en voksen og et barn som den voksne har omsorg for.</riktig>
        <feil>Ordet «nære» betyr her personer som står deg nær, for eksempel familie, kjæreste eller ektefelle.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-02" emne="Vold i nære relasjoner">
      <tekst>Hva er psykisk vold?</tekst>
      <svar riktig="true">Trusler, ydmykelse og sterk kontroll</svar>
      <svar>Slag og spark som gir blåmerker</svar>
      <svar>Å ødelegge ting som en annen eier</svar>
      <tilbakemelding>
        <riktig>Riktig. Psykisk vold er for eksempel trusler, å gjøre noen redd, ydmykelse og sterk kontroll. Det gir ikke synlige skader, men det kan skade mye.</riktig>
        <feil>Psykisk vold handler om ord og kontroll som skader en person, for eksempel trusler og ydmykelse.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-03" emne="Vold i nære relasjoner">
      <tekst>Hva er materiell vold?</tekst>
      <svar riktig="true">Å knuse eller ødelegge ting i hjemmet</svar>
      <svar>Å true en person med å skade henne</svar>
      <svar>Å tvinge noen til sex mot sin vilje</svar>
      <tilbakemelding>
        <riktig>Riktig. Materiell vold er å knuse, kaste eller ødelegge ting, for eksempel i hjemmet. Det kan gjøre andre redde.</riktig>
        <feil>Materiell vold handler om ting. Det er å ødelegge eller knuse ting for å skremme eller skade.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-04" emne="Vold i nære relasjoner">
      <tekst>Hva er seksuell vold?</tekst>
      <svar riktig="true">Å tvinge noen til seksuelle handlinger</svar>
      <svar>Å slå noen i ansiktet med flat hånd</svar>
      <svar>Å kaste og knuse telefonen til noen</svar>
      <tilbakemelding>
        <riktig>Riktig. Seksuell vold er å tvinge eller presse noen til seksuelle handlinger som de ikke vil.</riktig>
        <feil>Seksuell vold handler om seksuelle handlinger som en person ikke har sagt ja til.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-05" emne="Vold i nære relasjoner">
      <tekst>Hva sier norsk lov om vold i familien?</tekst>
      <svar riktig="true">Vold er forbudt, også i familien</svar>
      <svar>Litt vold er lov når det skjer hjemme</svar>
      <svar>Familien bestemmer selv hva som er lov</svar>
      <tilbakemelding>
        <riktig>Riktig. Norges lover forbyr all bruk av vold. Det gjelder også vold i familien og i andre nære relasjoner.</riktig>
        <feil>Norske lover sier at vold er forbudt overalt, også hjemme og i familien.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-06" emne="Vold i nære relasjoner">
      <tekst>Hvorfor er vold i nære relasjoner ikke en privatsak?</tekst>
      <svar riktig="true">Samfunnet har ansvar for å beskytte alle</svar>
      <svar>Familien må betale en bot til staten</svar>
      <svar>Naboene bestemmer hva som skjer hjemme</svar>
      <tilbakemelding>
        <riktig>Riktig. Vold i nære relasjoner er ikke en privatsak. Samfunnet har ansvar for å beskytte og ta vare på alle som blir utsatt for vold.</riktig>
        <feil>Vold hjemme er alvorlig kriminalitet. Derfor skal samfunnet, for eksempel politiet og barnevernet, hjelpe.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-07" emne="Vold i nære relasjoner">
      <tekst>En mann sier at volden skyldes kulturen hans. Hva gjelder i Norge?</tekst>
      <svar riktig="true">Vold er straffbart uansett årsak</svar>
      <svar>Vold er lov hvis det er vanlig i kulturen</svar>
      <svar>Vold er lov hvis kona har gjort noe galt</svar>
      <tilbakemelding>
        <riktig>Riktig. Vold er forbudt i Norge, uansett hva årsaken er. Kultur, religion eller tradisjon gjør ikke vold lovlig.</riktig>
        <feil>Norske lover gjelder for alle. Ingen årsak gjør det lov å bruke vold mot andre.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-08" emne="Vold i nære relasjoner">
      <tekst>Hvem gjelder forbudet mot vold i familien for?</tekst>
      <svar riktig="true">Alle som bor eller oppholder seg i Norge</svar>
      <svar>Personer som er norske statsborgere</svar>
      <svar>Familier som har barn under 18 år</svar>
      <tilbakemelding>
        <riktig>Riktig. Norske lover gjelder for alle som bor eller oppholder seg i Norge. Alle har rett til et liv uten vold.</riktig>
        <feil>Forbudet mot vold gjelder for alle i Norge, uansett statsborgerskap, alder eller familie.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-09" emne="Vold i nære relasjoner">
      <tekst>Et barn ser at moren blir slått hjemme. Kan dette skade barnet?</tekst>
      <svar riktig="true">Ja, det kan skade barnet å se vold</svar>
      <svar>Nei, barnet blir ikke slått selv</svar>
      <svar>Nei, små barn forstår ikke det de ser</svar>
      <tilbakemelding>
        <riktig>Riktig. Det kan skade et barn å se eller høre vold hjemme, selv om barnet ikke blir slått selv.</riktig>
        <feil>Barn merker vold hjemme, også når de ikke blir slått selv. Det kan gi barnet frykt og vonde minner.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-10" emne="Vold i nære relasjoner">
      <tekst>Hvilken gruppe kan være ekstra utsatt for vold i nære relasjoner?</tekst>
      <svar riktig="true">LHBTIQ+-personer, som lesbiske og homofile</svar>
      <svar>Personer som har høy utdanning og god lønn</svar>
      <svar>Personer som bor alene i en stor by i Norge</svar>
      <tilbakemelding>
        <riktig>Riktig. Samfunnskunnskap.no skriver at LHBTIQ+-personer, for eksempel lesbiske, homofile, bifile og transpersoner, kan være ekstra utsatt for vold i nære relasjoner.</riktig>
        <feil>Kilden nevner en gruppe som kan møte vold fra familien på grunn av hvem de er eller hvem de elsker.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-11" emne="Vold i nære relasjoner">
      <tekst>Hvordan ser det norske samfunnet på tvangsekteskap og kjønnslemlestelse?</tekst>
      <svar riktig="true">Former for vold som ikke aksepteres</svar>
      <svar>Private saker som familien bestemmer</svar>
      <svar>Gamle tradisjoner som er lov i Norge</svar>
      <tilbakemelding>
        <riktig>Riktig. Tvangsekteskap og kjønnslemlestelse er også vold. Det kan ikke aksepteres i Norge.</riktig>
        <feil>Å tvinge noen til å gifte seg eller å skade kjønnsorganene til en jente er vold. Begge deler er forbudt.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-12" emne="Vold i nære relasjoner">
      <tekst>Hva kan straffen være for mishandling i nære relasjoner?</tekst>
      <svar riktig="true">Fengsel i inntil 6 år</svar>
      <svar>Bot på inntil 5 000 kroner</svar>
      <svar>Fengsel i inntil 3 måneder</svar>
      <tilbakemelding>
        <riktig>Riktig. Etter straffeloven § 282 kan mishandling i nære relasjoner gi fengsel i inntil 6 år.</riktig>
        <feil>Mishandling i nære relasjoner er en alvorlig forbrytelse. Straffen kan være flere år i fengsel.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-13" emne="Vold i nære relasjoner">
      <tekst>Hva kan straffen være for grov mishandling i nære relasjoner?</tekst>
      <svar riktig="true">Fengsel i inntil 15 år</svar>
      <svar>Fengsel i inntil 2 år</svar>
      <svar>Bot og samfunnsstraff</svar>
      <tilbakemelding>
        <riktig>Riktig. Grov mishandling i nære relasjoner kan gi fengsel i inntil 15 år (straffeloven § 283).</riktig>
        <feil>Når mishandlingen er grov, for eksempel varer lenge eller gir store skader, kan straffen bli svært streng.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-14" emne="Vold i nære relasjoner">
      <tekst>Hvem er beskyttet av loven om mishandling i nære relasjoner?</tekst>
      <svar riktig="true">Blant annet ektefelle, samboer og barn</svar>
      <svar>Blant annet kolleger, naboer og gode venner</svar>
      <svar>Blant annet kunder, turister og fremmede</svar>
      <tilbakemelding>
        <riktig>Riktig. Loven beskytter blant annet nåværende og tidligere ektefeller og samboere, barn, foreldre og andre i samme husstand.</riktig>
        <feil>Loven handler om personer i familien og hjemmet, også en tidligere ektefelle eller samboer.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-15" emne="Vold i nære relasjoner">
      <tekst>Hva betyr «avvergeplikt»?</tekst>
      <svar riktig="true">Plikt til å prøve å stoppe alvorlig vold</svar>
      <svar>Plikt til å holde vold i familien hemmelig</svar>
      <svar>Plikt til å flytte når det er vold hjemme</svar>
      <tilbakemelding>
        <riktig>Riktig. Avvergeplikt betyr at man må prøve å stoppe alvorlige lovbrudd, for eksempel ved å varsle politiet. Det gjelder blant annet mishandling i nære relasjoner.</riktig>
        <feil>Å «avverge» betyr å hindre eller stoppe. Avvergeplikten handler om å hindre alvorlige lovbrudd.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-16" emne="Vold i nære relasjoner">
      <tekst>Hvem har plikt til å prøve å avverge mishandling i nære relasjoner?</tekst>
      <svar riktig="true">Alle, også de som har taushetsplikt</svar>
      <svar>Politiet og ansatte i barnevernet</svar>
      <svar>Familiemedlemmer som bor sammen</svar>
      <tilbakemelding>
        <riktig>Riktig. Avvergeplikten gjelder alle, også de som har taushetsplikt. Brudd på plikten kan gi bot eller fengsel i inntil 1 år.</riktig>
        <feil>Avvergeplikten gjelder ikke bare noen yrker. Den gjelder for alle personer i Norge.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-17" emne="Vold i nære relasjoner">
      <tekst>Du hører at naboen blir slått og skriker om hjelp. Hva bør du gjøre?</tekst>
      <svar riktig="true">Ringe politiet på 112</svar>
      <svar>Vente og spørre naboen neste dag</svar>
      <svar>Skru opp musikken og gå til sengs</svar>
      <tilbakemelding>
        <riktig>Riktig. Når noen er i fare akkurat nå, skal du ringe politiet på 112.</riktig>
        <feil>Vold er farlig og kan skje igjen. Ring 112 hvis noen er i fare akkurat nå.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-18" emne="Vold i nære relasjoner">
      <tekst>Hva betyr det å «anmelde» vold?</tekst>
      <svar riktig="true">Å melde fra til politiet om et lovbrudd</svar>
      <svar>Å skrive om volden på sosiale medier</svar>
      <svar>Å snakke med familien om det som skjedde</svar>
      <tilbakemelding>
        <riktig>Riktig. Å anmelde betyr å melde fra til politiet om et lovbrudd, for eksempel vold. Politiet kan da etterforske saken.</riktig>
        <feil>En anmeldelse går til politiet. Da kan politiet undersøke saken.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-19" emne="Vold i nære relasjoner">
      <tekst>En lærer tror at en elev blir slått hjemme. Hva må læreren gjøre?</tekst>
      <svar riktig="true">Melde fra til barnevernet</svar>
      <svar>Snakke med foreldrene og la det være</svar>
      <svar>Vente til eleven blir 18 år</svar>
      <tilbakemelding>
        <riktig>Riktig. Ansatte i skolen har plikt til å melde fra til barnevernet når de tror at et barn blir mishandlet.</riktig>
        <feil>Læreren skal ikke vente. Ansatte i skolen har plikt til å melde fra til barnevernet.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-20" emne="Vold i nære relasjoner">
      <tekst>Hva er et krisesenter?</tekst>
      <svar riktig="true">Et trygt sted for dem som er utsatt for vold</svar>
      <svar>Et sykehus for dem som er skadet i trafikken</svar>
      <svar>Et kontor der man søker om kommunal bolig</svar>
      <tilbakemelding>
        <riktig>Riktig. Et krisesenter er et trygt sted der personer som er utsatt for vold eller trusler i nære relasjoner, kan få hjelp og bo en periode.</riktig>
        <feil>Krisesenteret er for personer som er utsatt for vold eller trusler fra noen i familien eller en partner.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-21" emne="Vold i nære relasjoner">
      <tekst>Hvem kan få hjelp på et krisesenter?</tekst>
      <svar riktig="true">Kvinner, menn og barn som er utsatt for vold</svar>
      <svar>Turister som trenger et billig sted å bo</svar>
      <svar>Personer som har mistet jobben og boligen</svar>
      <tilbakemelding>
        <riktig>Riktig. Krisesentertilbudet er for kvinner, menn og barn som er utsatt for vold eller trusler om vold i nære relasjoner.</riktig>
        <feil>Krisesenteret er for alle som er utsatt for vold i nære relasjoner. Kjønn og statsborgerskap har ingen betydning.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-22" emne="Vold i nære relasjoner">
      <tekst>Hva koster det å bo på et krisesenter?</tekst>
      <svar riktig="true">Det er gratis for alle som trenger det</svar>
      <svar>Det koster omtrent 500 kroner per natt</svar>
      <svar>Man betaler en egenandel hver uke</svar>
      <tilbakemelding>
        <riktig>Riktig. Krisesentertilbudet er gratis. Det står i krisesenterloven.</riktig>
        <feil>Ingen skal la være å søke hjelp fordi de mangler penger. Krisesentertilbudet koster ikke noe.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-23" emne="Vold i nære relasjoner">
      <tekst>Hvordan kan man komme til et krisesenter?</tekst>
      <svar riktig="true">Man kan ta kontakt selv, uten henvisning</svar>
      <svar>Man må først få en henvisning fra Nav</svar>
      <svar>Man må først anmelde volden til politiet</svar>
      <tilbakemelding>
        <riktig>Riktig. Du kan ta kontakt med krisesenteret selv. Du trenger ikke henvisning eller timeavtale, og du trenger ikke å ha anmeldt volden.</riktig>
        <feil>Det er lett å få hjelp på et krisesenter. Du kan ringe eller komme direkte selv.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-24" emne="Vold i nære relasjoner">
      <tekst>Hvem har ansvar for at det finnes et krisesentertilbud?</tekst>
      <svar riktig="true">Kommunen</svar>
      <svar>Arbeidsgiveren</svar>
      <svar>Kirken</svar>
      <tilbakemelding>
        <riktig>Riktig. Etter krisesenterloven har kommunen ansvar for å ha et krisesentertilbud.</riktig>
        <feil>Krisesentertilbudet er en offentlig tjeneste. Det er kommunen som har ansvaret.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-25" emne="Vold i nære relasjoner">
      <tekst>Hva gjør krisesenteret med opplysninger om hvem som bor der?</tekst>
      <svar riktig="true">De ansatte har taushetsplikt</svar>
      <svar>De sender navnene til familien</svar>
      <svar>De legger ut navnene på nettet</svar>
      <tilbakemelding>
        <riktig>Riktig. De som jobber på krisesenteret, har taushetsplikt. De skal ikke fortelle andre hvem som bor der.</riktig>
        <feil>Krisesenteret skal være trygt. De ansatte skal ikke gi ut opplysninger om hvem som bor der.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-26" emne="Vold i nære relasjoner">
      <tekst>Hva er Vold- og overgrepslinjen, 116 006?</tekst>
      <svar riktig="true">En gratis og anonym hjelpelinje</svar>
      <svar>Et nummer for å bestille legetime</svar>
      <svar>Et nummer for å melde fra om innbrudd</svar>
      <tilbakemelding>
        <riktig>Riktig. Vold- og overgrepslinjen, 116 006, er gratis og døgnåpen. Du kan være anonym.</riktig>
        <feil>116 006 er en hjelpelinje for deg som opplever vold eller overgrep i nære relasjoner.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-27" emne="Vold i nære relasjoner">
      <tekst>Hvor kan barn og unge ringe hvis de blir utsatt for vold?</tekst>
      <svar riktig="true">Alarmtelefonen for barn og unge, 116 111</svar>
      <svar>Legevakten, 116 117, for å bestille time</svar>
      <svar>Skatteetaten, 800 80 000, for å få råd</svar>
      <tilbakemelding>
        <riktig>Riktig. Alarmtelefonen for barn og unge, 116 111, er gratis og åpen hele døgnet. Voksne som er bekymret for et barn, kan også ringe.</riktig>
        <feil>Barn og unge som blir utsatt for vold, kan ringe Alarmtelefonen. Nummeret er 116 111.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-28" emne="Vold i nære relasjoner">
      <tekst>Hvor kan eldre over 62 år ringe hvis de utsettes for vold?</tekst>
      <svar riktig="true">Vern for eldre, 800 30 196</svar>
      <svar>Nav kontaktsenter, 55 55 33 33</svar>
      <svar>Opplysningen, 1881</svar>
      <tilbakemelding>
        <riktig>Riktig. Vern for eldre, 800 30 196, gir råd og hjelp til personer over 62 år som er utsatt for vold og overgrep.</riktig>
        <feil>Det finnes en egen kontakttelefon for eldre som blir utsatt for vold. Den heter Vern for eldre.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-29" emne="Vold i nære relasjoner">
      <tekst>Hva er dinutvei.no?</tekst>
      <svar riktig="true">En nettside om vold og hjelpetilbud</svar>
      <svar>En nettside for å søke jobb i kommunen</svar>
      <svar>En nettside for å kjøpe bussbilletter</svar>
      <tilbakemelding>
        <riktig>Riktig. Dinutvei.no har informasjon om vold og overgrep, og om hvor man kan få hjelp.</riktig>
        <feil>Dinutvei.no er en nettside for deg som opplever vold, og for dem som vil hjelpe.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-30" emne="Vold i nære relasjoner">
      <tekst>Hva er et kontaktforbud?</tekst>
      <svar riktig="true">Forbud mot å oppsøke eller kontakte noen</svar>
      <svar>Forbud mot å ringe politiet om natten</svar>
      <svar>Forbud mot å bruke mobil på skolen</svar>
      <tilbakemelding>
        <riktig>Riktig. Et kontaktforbud betyr at en person ikke får oppsøke, følge etter eller kontakte en annen person. Politiet eller retten kan bestemme det.</riktig>
        <feil>Et kontaktforbud skal beskytte en person som er utsatt for vold eller trusler.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-31" emne="Vold i nære relasjoner">
      <tekst>Ana har opphold fordi hun er gift. Mannen mishandler henne. Hva kan hun søke om?</tekst>
      <svar riktig="true">Egen oppholdstillatelse hos UDI</svar>
      <svar>Norsk statsborgerskap med en gang</svar>
      <svar>Penger fra mannen som en straff</svar>
      <tilbakemelding>
        <riktig>Riktig. Hvis du har familieinnvandring og er mishandlet av ektefellen eller samboeren, kan du søke UDI om egen oppholdstillatelse. Du må ha flyttet fra personen.</riktig>
        <feil>Ingen skal måtte bli i et voldelig ekteskap for å få bli i Norge. UDI har en egen regel for dette.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-32" emne="Vold i nære relasjoner">
      <tekst>Er det voldtekt å tvinge ektefellen sin til sex?</tekst>
      <svar riktig="true">Ja, det er straffbart også i ekteskap</svar>
      <svar>Nei, ektefeller har rett til sex</svar>
      <svar>Nei, det er en sak mellom ektefellene</svar>
      <tilbakemelding>
        <riktig>Riktig. Sex uten samtykke er voldtekt, også i ekteskap og i samboerforhold.</riktig>
        <feil>Å være gift gir ingen rett til sex. Begge må alltid ville selv.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-33" emne="Tvangsekteskap">
      <tekst>Kan en person under 18 år få særskilt lov til å gifte seg i Norge?</tekst>
      <svar riktig="true">Nei, det finnes ingen unntak</svar>
      <svar>Ja, hvis foreldrene sier ja</svar>
      <svar>Ja, hvis statsforvalteren sier ja</svar>
      <tilbakemelding>
        <riktig>Riktig. Ifølge ekteskapsloven kan man ikke gifte seg før man er 18 år. Det finnes ingen unntak.</riktig>
        <feil>Fra 2018 gjelder 18-årsgrensen uten unntak. Verken foreldre eller myndigheter kan gi lov før man er 18 år.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-34" emne="Tvangsekteskap">
      <tekst>Hva betyr «tvangsekteskap»?</tekst>
      <svar riktig="true">At noen blir tvunget til å gifte seg</svar>
      <svar>At to personer gifter seg uten en stor fest</svar>
      <svar>At to personer gifter seg uten å ha bodd sammen</svar>
      <tilbakemelding>
        <riktig>Riktig. Et tvangsekteskap er et ekteskap der minst én av dem blir presset eller tvunget til å gifte seg. Det er forbudt i Norge.</riktig>
        <feil>Ordet «tvang» betyr at noen ikke får velge fritt. Alle ekteskap skal inngås frivillig.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-35" emne="Tvangsekteskap">
      <tekst>Hva er et arrangert ekteskap?</tekst>
      <svar riktig="true">Familien foreslår en ektefelle, og paret sier fritt ja</svar>
      <svar>Familien truer paret til å gifte seg med hverandre</svar>
      <svar>Paret gifter seg i hemmelighet uten at familien vet om det</svar>
      <tilbakemelding>
        <riktig>Riktig. I et arrangert ekteskap hjelper familien med å finne en ektefelle, men de to sier fritt ja selv.</riktig>
        <feil>I et arrangert ekteskap er det ingen tvang. De to som skal gifte seg, sier ja av egen fri vilje.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-36" emne="Tvangsekteskap">
      <tekst>Hva kan straffen være for å tvinge noen til å gifte seg?</tekst>
      <svar riktig="true">Fengsel i inntil 6 år</svar>
      <svar>Bot på inntil 10 000 kroner</svar>
      <svar>Fengsel i inntil 6 måneder</svar>
      <tilbakemelding>
        <riktig>Riktig. Etter straffeloven § 253 kan den som tvinger noen til å gifte seg, få fengsel i inntil 6 år.</riktig>
        <feil>Tvangsekteskap er en alvorlig forbrytelse. Straffen kan være flere år i fengsel.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-37" emne="Tvangsekteskap">
      <tekst>En onkel hjelper til med å tvinge en jente til ekteskap. Kan han straffes?</tekst>
      <svar riktig="true">Ja, den som hjelper til kan straffes</svar>
      <svar>Nei, han er ikke foreldre til jenta</svar>
      <svar>Nei, det er en sak for familien selv</svar>
      <tilbakemelding>
        <riktig>Riktig. Også den som hjelper til med et tvangsekteskap, kan straffes. Det kalles medvirkning.</riktig>
        <feil>Det er ikke bare den som tvinger, som kan straffes. Den som hjelper til, kan også straffes.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-38" emne="Tvangsekteskap">
      <tekst>Hvem må si ja for at et ekteskap skal være gyldig?</tekst>
      <svar riktig="true">De to som skal gifte seg</svar>
      <svar>Foreldrene til de to</svar>
      <svar>Den eldste i familien</svar>
      <tilbakemelding>
        <riktig>Riktig. Ekteskap skal inngås av egen fri vilje. De to som skal gifte seg, må selv si ja.</riktig>
        <feil>Det er de to som gifter seg, som må gi samtykke. Familien kan ikke si ja for dem.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-39" emne="Tvangsekteskap">
      <tekst>Hva må man blant annet ha for å gifte seg i Norge?</tekst>
      <svar riktig="true">Lovlig opphold i Norge</svar>
      <svar>Norsk statsborgerskap</svar>
      <svar>Fast jobb i Norge</svar>
      <tilbakemelding>
        <riktig>Riktig. For å gifte seg i Norge må man blant annet være over 18 år, ikke være gift fra før og ha lovlig opphold her.</riktig>
        <feil>Man trenger ikke være norsk statsborger eller ha jobb. Men man må ha lovlig opphold i Norge.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-40" emne="Tvangsekteskap">
      <tekst>Kan man gifte seg på nytt hvis man er gift fra før?</tekst>
      <svar riktig="true">Nei, man må først skille seg</svar>
      <svar>Ja, hvis den første ektefellen er enig</svar>
      <svar>Ja, hvis det første bryllupet var i utlandet</svar>
      <tilbakemelding>
        <riktig>Riktig. I Norge kan man bare være gift med én person. Man må skille seg før man kan gifte seg på nytt.</riktig>
        <feil>Det er forbudt å inngå et nytt ekteskap så lenge et tidligere ekteskap består.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-41" emne="Tvangsekteskap">
      <tekst>Hva kan en domstol gjøre når noen er tvunget til å gifte seg?</tekst>
      <svar riktig="true">Kjenne ekteskapet ugyldig</svar>
      <svar>Gi paret råd om å få barn</svar>
      <svar>Gi familien lov til ekteskapet</svar>
      <tilbakemelding>
        <riktig>Riktig. Den som er tvunget til å gifte seg, kan gå til en norsk domstol og få ekteskapet kjent ugyldig.</riktig>
        <feil>Et tvangsekteskap er ugyldig etter norsk rett. Den som er tvunget, kan få hjelp fra domstolen.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-42" emne="Tvangsekteskap">
      <tekst>Hva er den lengste fristen for å få et tvangsekteskap kjent ugyldig?</tekst>
      <svar riktig="true">Fem år etter at man giftet seg</svar>
      <svar>Ti år etter at man giftet seg</svar>
      <svar>Tjue år etter at man giftet seg</svar>
      <tilbakemelding>
        <riktig>Riktig. Saken må reises senest fem år etter bryllupet, og innen ett år etter at personen ble fri for tvangen.</riktig>
        <feil>Det finnes en frist. Etter ekteskapsloven er den lengste fristen fem år etter at man giftet seg.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-43" emne="Tvangsekteskap">
      <tekst>Er det lov å tvinge noen inn i et uoffisielt ekteskap uten papirer?</tekst>
      <svar riktig="true">Nei, det er også straffbart</svar>
      <svar>Ja, hvis familien er enig i det</svar>
      <svar>Ja, fordi staten ikke har registrert det</svar>
      <tilbakemelding>
        <riktig>Riktig. Det er også straffbart å tvinge noen inn i et forhold som ligner ekteskap, selv om det ikke er registrert hos staten.</riktig>
        <feil>Loven gjelder også ekteskap uten offisielle papirer, for eksempel bare en religiøs eller kulturell seremoni.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-44" emne="Tvangsekteskap">
      <tekst>Er det straffbart å lure noen til utlandet for å tvangsgifte dem?</tekst>
      <svar riktig="true">Ja, det straffes på samme måte</svar>
      <svar>Nei, utlandet har sine egne lover</svar>
      <svar>Nei, personen reiste jo frivillig</svar>
      <tilbakemelding>
        <riktig>Riktig. Å lure eller hjelpe noen til å reise til et annet land for å tvangsgifte dem, straffes på samme måte som tvangsekteskap.</riktig>
        <feil>Tvangsekteskap er straffbart for personer som bor i Norge, også når det skjer i utlandet.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-45" emne="Tvangsekteskap">
      <tekst>En 15-åring blir gift i utlandet. Blir ekteskapet godkjent i Norge?</tekst>
      <svar riktig="true">Nei, som hovedregel ikke</svar>
      <svar>Ja, hvis det var lovlig i det landet</svar>
      <svar>Ja, hvis foreldrene skrev under på det</svar>
      <tilbakemelding>
        <riktig>Riktig. Ekteskap der en av partene var under 18 år, blir som hovedregel ikke godkjent i Norge.</riktig>
        <feil>Norge godkjenner som hovedregel ikke barneekteskap, selv om de var lovlige i et annet land.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-46" emne="Tvangsekteskap">
      <tekst>Hva sier norsk lov om søskenbarn som vil gifte seg med hverandre?</tekst>
      <svar riktig="true">Det er som hovedregel forbudt</svar>
      <svar>Det er lov fra de er 16 år</svar>
      <svar>Det er lov hvis familien er enig</svar>
      <tilbakemelding>
        <riktig>Riktig. Fra 1. januar 2025 er det som hovedregel forbudt for søskenbarn å gifte seg med hverandre.</riktig>
        <feil>Ekteskapsloven ble endret i 2025. Nå gjelder et forbud for søskenbarn, med svært få unntak.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-47" emne="Tvangsekteskap">
      <tekst>Mina (18) vil studere, men foreldrene vil at hun gifter seg. Hvem bestemmer?</tekst>
      <svar riktig="true">Mina bestemmer selv om og når hun gifter seg</svar>
      <svar>Foreldrene bestemmer fordi hun bor hjemme</svar>
      <svar>Foreldrene bestemmer fordi de betaler for henne</svar>
      <tilbakemelding>
        <riktig>Riktig. Mina er voksen og har rett til å bestemme selv om, når og med hvem hun gifter seg.</riktig>
        <feil>I Norge har kvinner og menn samme rett til å velge ektefelle selv. Foreldrene kan gi råd, men ikke bestemme.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-48" emne="Tvangsekteskap">
      <tekst>Hvor kan en ung person som er redd for tvangsekteskap, få råd anonymt?</tekst>
      <svar riktig="true">Hos Røde Kors-telefonen</svar>
      <svar>Hos Statens vegvesen</svar>
      <svar>Hos Skatteetaten</svar>
      <tilbakemelding>
        <riktig>Riktig. Røde Kors-telefonen om negativ sosial kontroll og æresrelatert vold gir råd om tvangsekteskap. Du kan være anonym.</riktig>
        <feil>Det finnes en egen hjelpetelefon fra Røde Kors for unge som er redde for tvangsekteskap.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-49" emne="Tvangsekteskap">
      <tekst>Omar er redd for å bli giftet bort på ferie i utlandet. Hva er lurt?</tekst>
      <svar riktig="true">Å snakke med noen han stoler på før reisen</svar>
      <svar>Å reise uten å fortelle noen om frykten</svar>
      <svar>Å vente og se hva som skjer på ferien</svar>
      <tilbakemelding>
        <riktig>Riktig. Det er lurt å si fra før reisen, for eksempel til en lærer, en mangfoldsrådgiver, Røde Kors-telefonen eller politiet.</riktig>
        <feil>Det er lettere å få hjelp før reisen. Fortell noen du stoler på, eller ring en hjelpetelefon.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-50" emne="Tvangsekteskap">
      <tekst>Hvordan kan en norsk ambassade hjelpe en som er tvangsgiftet i utlandet?</tekst>
      <svar riktig="true">Gi råd og hjelp til å komme trygt hjem</svar>
      <svar>Godkjenne ekteskapet slik at det gjelder</svar>
      <svar>Sende personen tilbake til familien</svar>
      <tilbakemelding>
        <riktig>Riktig. Norske ambassader kan gi råd og hjelpe personer som er utsatt for tvangsekteskap, med å komme trygt tilbake til Norge.</riktig>
        <feil>Ambassaden er Norges kontor i et annet land. Der kan man få hjelp hvis man er utsatt for tvang.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-51" emne="Negativ sosial kontroll">
      <tekst>Hva er sosial kontroll?</tekst>
      <svar riktig="true">Rammer for oppførsel som familie og samfunn setter</svar>
      <svar>En støtteordning som man kan søke om hos Nav-kontoret</svar>
      <svar>En kontroll av pass og ID-kort ved grensen</svar>
      <tilbakemelding>
        <riktig>Riktig. Sosial kontroll er rammene og reglene for oppførsel som familien og samfunnet setter rundt hver person.</riktig>
        <feil>Sosial kontroll handler om regler for hvordan vi skal oppføre oss, i familien og i samfunnet.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-52" emne="Negativ sosial kontroll">
      <tekst>Når kan sosial kontroll bli negativ?</tekst>
      <svar riktig="true">Når reglene er så strenge at de tar bort friheten</svar>
      <svar>Når foreldrene vil at barna skal gjøre lekser</svar>
      <svar>Når skolen har regler for når timene starter</svar>
      <tilbakemelding>
        <riktig>Riktig. Sosial kontroll blir negativ når reglene er så strenge at de tar fra en person friheten og retten til et selvstendig liv.</riktig>
        <feil>Vanlige regler hjemme og på skolen er ikke negativ kontroll. Det blir negativt når reglene tar bort friheten.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-53" emne="Negativ sosial kontroll">
      <tekst>Hvordan kan negativ sosial kontroll påvirke integreringen til barn og unge?</tekst>
      <svar riktig="true">Den kan hindre at de blir en del av samfunnet</svar>
      <svar>Den gjør det mye lettere å få nye venner i Norge</svar>
      <svar>Den har ingen betydning for barn og unge</svar>
      <tilbakemelding>
        <riktig>Riktig. Negativ sosial kontroll kan hindre at barn og unge blir integrert i det norske samfunnet.</riktig>
        <feil>Når unge ikke får delta i fritid og sosiale aktiviteter, blir det vanskeligere å bli en del av samfunnet.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-54" emne="Negativ sosial kontroll">
      <tekst>Hvilket eksempel kan være negativ sosial kontroll?</tekst>
      <svar riktig="true">Familien bestemmer hvem du får være venn med</svar>
      <svar>Familien spør hvordan det gikk på skolen</svar>
      <svar>Familien ber deg rydde rommet ditt</svar>
      <tilbakemelding>
        <riktig>Riktig. Å bestemme hvem en person får være venn med, kan være negativ sosial kontroll.</riktig>
        <feil>Det er vanlig at foreldre spør om skolen og ber barna hjelpe til hjemme. Det er ikke negativ kontroll.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-55" emne="Negativ sosial kontroll">
      <tekst>Merhet (14) må slutte med håndball fordi faren ikke liker klærne. Hva er dette?</tekst>
      <svar riktig="true">Det kan være negativ sosial kontroll</svar>
      <svar>Det er et krav fra idrettslaget</svar>
      <svar>Det er en regel som skolen har laget</svar>
      <tilbakemelding>
        <riktig>Riktig. Når familien hindrer en ung person i fritidsaktiviteter på grunn av strenge regler, kan det være negativ sosial kontroll.</riktig>
        <feil>Merhet må slutte med noe hun liker fordi familien har strenge regler. Tenk på hva det kan kalles.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-56" emne="Negativ sosial kontroll">
      <tekst>Moren til Merhet sjekker telefonen hennes hver kveld. Hva kan dette være?</tekst>
      <svar riktig="true">Negativ sosial kontroll</svar>
      <svar>Vanlig hjelp med lekser</svar>
      <svar>Et krav fra skolen</svar>
      <tilbakemelding>
        <riktig>Riktig. Å sjekke telefonen til en ungdom hver kveld for å se hvem hun snakker med, kan være negativ sosial kontroll.</riktig>
        <feil>Sterk kontroll av hvem en ung person snakker med, tar bort friheten. Tenk på hva det kalles.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-57" emne="Negativ sosial kontroll">
      <tekst>Hvem kan bli utsatt for negativ sosial kontroll?</tekst>
      <svar riktig="true">Jenter, gutter, kvinner og menn</svar>
      <svar>Jenter, men ikke gutter eller voksne</svar>
      <svar>Voksne, men ikke barn og unge</svar>
      <tilbakemelding>
        <riktig>Riktig. Alle kan bli utsatt for negativ sosial kontroll, både jenter, gutter, kvinner og menn.</riktig>
        <feil>Negativ sosial kontroll kan ramme personer i alle aldre og av alle kjønn.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-58" emne="Negativ sosial kontroll">
      <tekst>Hvilken rett kan negativ sosial kontroll ta fra en person?</tekst>
      <svar riktig="true">Retten til å leve et selvstendig liv</svar>
      <svar>Retten til å få gratis skolegang</svar>
      <svar>Retten til å stemme ved valg</svar>
      <tilbakemelding>
        <riktig>Riktig. Negativ sosial kontroll kan ta fra en person friheten og retten til å leve et selvstendig liv.</riktig>
        <feil>Negativ sosial kontroll handler om friheten til å ta egne valg i livet.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-59" emne="Negativ sosial kontroll">
      <tekst>Er det lov å true et barn for å bestemme hvem barnet møter?</tekst>
      <svar riktig="true">Nei, trusler og vold er forbudt</svar>
      <svar>Ja, foreldre bestemmer over barna</svar>
      <svar>Ja, hvis barnet er under 18 år</svar>
      <tilbakemelding>
        <riktig>Riktig. Trusler og vold er forbudt, også fra foreldre. Negativ sosial kontroll kan også innebære vold.</riktig>
        <feil>Foreldre kan sette grenser, men de har ikke lov til å true eller bruke vold mot barna.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-60" emne="Negativ sosial kontroll">
      <tekst>Hva betyr «æresrelatert vold»?</tekst>
      <svar riktig="true">Vold for å beskytte familiens ære</svar>
      <svar>Vold mellom to lag under en fotballkamp</svar>
      <svar>Vold som skjer ved et uhell i trafikken</svar>
      <tilbakemelding>
        <riktig>Riktig. Æresrelatert vold er vold eller trusler som skal beskytte eller gjenopprette familiens ære og rykte.</riktig>
        <feil>Ordet «ære» handler om hva andre tenker om familien. Æresrelatert vold er forbudt som all annen vold.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-61" emne="Negativ sosial kontroll">
      <tekst>Hva gjør en mangfoldsrådgiver?</tekst>
      <svar riktig="true">Hjelper unge som opplever kontroll og press</svar>
      <svar>Underviser elever i flere ulike språk</svar>
      <svar>Ansetter folk med ulik bakgrunn i kommunen</svar>
      <tilbakemelding>
        <riktig>Riktig. Mangfoldsrådgivere (tidligere kalt minoritetsrådgivere) hjelper unge som opplever negativ sosial kontroll, æresrelatert vold eller tvangsekteskap.</riktig>
        <feil>En mangfoldsrådgiver arbeider på skoler og hjelper unge som opplever press og kontroll.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-62" emne="Negativ sosial kontroll">
      <tekst>Hvor kan en elev møte en mangfoldsrådgiver?</tekst>
      <svar riktig="true">På noen ungdoms- og videregående skoler</svar>
      <svar>På noen sykehus og legekontorer</svar>
      <svar>På noen politistasjoner og tingretter</svar>
      <tilbakemelding>
        <riktig>Riktig. IMDi har mangfoldsrådgivere på noen ungdomsskoler og videregående skoler, og på noen voksenopplæringssentre.</riktig>
        <feil>Mangfoldsrådgivere arbeider der unge er hver dag, nemlig på noen skoler.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-63" emne="Negativ sosial kontroll">
      <tekst>Hva gjør Kompetanseteamet mot negativ sosial kontroll og æresrelatert vold?</tekst>
      <svar riktig="true">Gir råd og veiledning i slike saker</svar>
      <svar>Gir straff til dem som kontrollerer andre</svar>
      <svar>Gir penger til familier med lav inntekt</svar>
      <tilbakemelding>
        <riktig>Riktig. Kompetanseteamet gir råd og veiledning til utsatte personer og til hjelpeapparatet. Telefonen er 478 090 50.</riktig>
        <feil>Kompetanseteamet er et nasjonalt team ledet av Bufdir. De gir råd, men de straffer ikke.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-64" emne="Negativ sosial kontroll">
      <tekst>Hva er Røde Kors-telefonen om negativ sosial kontroll?</tekst>
      <svar riktig="true">En hjelpetelefon der man kan være anonym</svar>
      <svar>En telefon for å bestille time hos legen</svar>
      <svar>En telefon for å melde fra om ulykker</svar>
      <tilbakemelding>
        <riktig>Riktig. Røde Kors-telefonen gir råd om negativ sosial kontroll, æresrelatert vold, tvangsekteskap og kjønnslemlestelse. Du kan være anonym.</riktig>
        <feil>Røde Kors-telefonen er en hjelpetelefon. Den hjelper med kontroll, press og vold fra familien.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-65" emne="Negativ sosial kontroll">
      <tekst>Hva betyr det å leve et «dobbeltliv»?</tekst>
      <svar riktig="true">Å skjule deler av livet for familien</svar>
      <svar>Å ha to ulike jobber på samme tid</svar>
      <svar>Å ha to hjem i to ulike land samtidig</svar>
      <tilbakemelding>
        <riktig>Riktig. Å leve et dobbeltliv betyr å skjule deler av livet sitt, for eksempel en kjæreste eller venner, fordi familien ikke godtar det.</riktig>
        <feil>Et dobbeltliv betyr at man lever på én måte hjemme og på en annen måte i hemmelighet.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-66" emne="Negativ sosial kontroll">
      <tekst>Hva betyr det å bli «etterlatt i utlandet»?</tekst>
      <svar riktig="true">Å bli holdt i et annet land mot sin vilje</svar>
      <svar>Å flytte frivillig til et annet land for å jobbe</svar>
      <svar>Å reise på ferie til utlandet med familien</svar>
      <tilbakemelding>
        <riktig>Riktig. Å bli etterlatt i utlandet betyr at noen blir holdt igjen i et annet land mot sin vilje, ofte etter en ferie.</riktig>
        <feil>Det handler om at personen ikke får komme tilbake til Norge, selv om hun eller han vil.</feil>
      </tilbakemelding>
    </sporsmal>
    <sporsmal id="frihet-67" emne="Negativ sosial kontroll">

</script>
<script>
(function(){
  // ---------- Data fra XML-filen ----------
  var doc = new DOMParser().parseFromString(document.getElementById('xmlData').textContent.trim(), 'application/xml');
  var openers = {riktig:[], feil:[]};
  doc.querySelectorAll('tilbakemeldingsmaler > apning').forEach(function(a){ openers[a.getAttribute('type')].push(a.textContent); });
  var categories = [], all = [];
  doc.querySelectorAll('kategori').forEach(function(k){
    var name = k.getAttribute('navn'); categories.push(name);
    k.querySelectorAll('sporsmal').forEach(function(q){
      var svar = Array.prototype.map.call(q.querySelectorAll('svar'), function(s){ return {text:s.textContent, correct:s.getAttribute('riktig')==='true'}; });
      all.push({id:q.getAttribute('id'), cat:name, text:q.querySelector('tekst').textContent, answers:svar,
        fbOk:q.querySelector('tilbakemelding > riktig').textContent, fbBad:q.querySelector('tilbakemelding > feil').textContent});
    });
  });

  // ---------- Hjelpefunksjoner ----------
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function el(tag, attrs, kids){ var e=document.createElement(tag); for(var k in (attrs||{})){ if(k==='class')e.className=attrs[k]; else if(k==='text')e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); } (kids||[]).forEach(function(c){ e.appendChild(typeof c==='string'?document.createTextNode(c):c); }); return e; }
  var app = document.getElementById('app');
  var first=true;
  function mount(node){ app.replaceChildren(node); var h=node.querySelector('h1,h2,.q'); if(first){first=false;return;} if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:false}); } }

  // Utvalg: jevn fordeling mellom valgte kategorier, ingen spørsmål to ganger.
  function draw(n, cats, ids){
    var pool = ids ? all.filter(function(q){return ids.indexOf(q.id)>-1;}) : all.filter(function(q){return cats.indexOf(q.cat)>-1;});
    if(ids) return shuffle(pool);
    var by = {}; cats.forEach(function(c){ by[c]=shuffle(pool.filter(function(q){return q.cat===c;})); });
    var out=[], i=0;
    while(out.length<n){ var c=cats[i%cats.length]; if(by[c].length) out.push(by[c].shift()); i++; if(i>n*cats.length+10) break; }
    return shuffle(out);
  }

  // ---------- Startskjerm ----------
  var settings = {n:36, cat:'alle'};
  function start(){
    var counts=[30,36,40];
    var f1=el('fieldset',{},[el('legend',{text:'Hvor mange spørsmål vil du ha?'}),el('div',{class:'chips'},counts.map(function(c){
      var id='n'+c; return el('span',{},[el('input',Object.assign({type:'radio',name:'n',id:id,value:c},settings.n===c?{checked:''}:{})),el('label',{for:id,text:c+' spørsmål'})]); }))]);
    var opts=['alle'].concat(categories);
    var f2=el('fieldset',{},[el('legend',{text:'Hvilket tema vil du øve på?'}),el('div',{class:'chips'},opts.map(function(c,i){
      var id='c'+i; return el('span',{},[el('input',Object.assign({type:'radio',name:'c',id:id,value:c},settings.cat===c?{checked:''}:{})),el('label',{for:id,text:c==='alle'?'Alle temaer':c})]); }))]);
    var go=el('button',{class:'btn',type:'button',text:'Start øvingen'});
    go.onclick=function(){ settings.n=+document.querySelector('input[name=n]:checked').value; settings.cat=document.querySelector('input[name=c]:checked').value;
      var cats=settings.cat==='alle'?categories:[settings.cat]; run(draw(settings.n,cats)); };
    mount(el('section',{class:'card',style:'display:flex;flex-direction:column;gap:1.4rem'},[
      el('h1',{text:'Øv til prøven i samfunnskunnskap'}),
      el('p',{class:'muted',text:'Du får tilbakemelding etter hvert svar. Hvis du svarer feil, får du et hint og kan prøve en gang til. Spørsmålene er på A2-nivå.'}),
      f1,f2,go,
      el('p',{class:'note',text:all.length+' spørsmål i banken. Temaer: '+categories.join(', ')+'.'})]));
  }

  // ---------- Test ----------
  function run(qs){
    var i=0, results=[];
    function show(){
      var q=qs[i], order=shuffle(q.answers), tries=0, done=false;
      var optsList=el('ul',{class:'opts'}), fbBox=el('div',{id:'fb','aria-live':'assertive'}), nextWrap=el('div',{class:'row'});
      var buttons=[];
      order.forEach(function(a,idx){
        var tag=el('span',{class:'tag',hidden:''});
        var b=el('button',{class:'opt',type:'button'},[el('span',{class:'k',text:String(idx+1)}),el('span',{},[a.text,tag])]);
        b.onclick=function(){ choose(a,b,tag); }; buttons.push({b:b,a:a,tag:tag}); optsList.appendChild(el('li',{},[b]));
      });
      function lockAll(){ buttons.forEach(function(x){x.b.disabled=true;}); }
      function mark(x,cls,label){ x.b.classList.add(cls); x.tag.textContent=label; x.tag.hidden=false; }
      function fb(kind,title,body){ fbBox.replaceChildren(el('div',{class:'fb '+kind},[el('strong',{text:title}),el('p',{text:body})])); }
      function finish(firstTry){
        done=true; lockAll(); results.push({q:q,first:firstTry});
        var last=i===qs.length-1;
        var nb=el('button',{class:'btn',type:'button',text:last?'Se resultatet':'Neste spørsmål'}); nb.onclick=function(){ if(last){ finishRun(); } else { i++; show(); } };
        nextWrap.replaceChildren(nb); nb.focus();
      }
      function choose(a,b,tag){
        if(done) return; tries++;
        var me=buttons.filter(function(x){return x.b===b;})[0];
        if(a.correct){
          mark(me,'ok','Riktig');
          var title=pick(openers.riktig); if(tries>1) title='Bra, nå fikk du det riktig.';
          fb('ok',title,q.fbOk); finish(tries===1);
        } else if(tries===1){
          mark(me,'bad','Ikke riktig'); b.disabled=true;
          fb('hint',pick(openers.feil),'Hint: '+q.fbBad+' Prøv en gang til.');
        } else {
          mark(me,'bad','Ikke riktig');
          buttons.forEach(function(x){ if(x.a.correct) mark(x,'ok','Riktig svar'); });
          fb('bad',pick(openers.feil),'Riktig svar: «'+order.filter(function(o){return o.correct;})[0].text+'». '+q.fbOk); finish(false);
        }
      }
      var pct=Math.round(i/qs.length*100);
      var node=el('section',{class:'card'},[
        el('div',{class:'progress'},[el('div',{class:'meta'},[el('span',{text:'Spørsmål '+(i+1)+' av '+qs.length}),el('span',{text:results.filter(function(r){return r.first;}).length+' riktige'})]),
          el('div',{class:'bar',role:'progressbar','aria-valuemin':'0','aria-valuemax':String(qs.length),'aria-valuenow':String(i)},[el('i',{style:'width:'+pct+'%'})])]),
        el('div',{style:'margin-top:1.1rem'},[el('div',{class:'cat',text:q.cat}),el('h2',{class:'q',text:q.text})]),
        optsList,
        el('div',{style:'display:flex;flex-direction:column;gap:1rem;margin-top:1.1rem'},[fbBox,nextWrap])]);
      mount(node);
    }
    function finishRun(){
      var right=results.filter(function(r){return r.first;}).length, total=results.length, pct=Math.round(right/total*100);
      var cats={}; results.forEach(function(r){ var c=cats[r.q.cat]||(cats[r.q.cat]={r:0,t:0}); c.t++; if(r.first)c.r++; });
      var missed=results.filter(function(r){return !r.first;});
      var msg = pct>=80?'Veldig bra! Du kan mye om dette.':pct>=60?'Bra jobbet. Øv litt mer på det du bommet på.':'Du er på vei. Øv på spørsmålene du svarte feil på, så går det bedre.';
      var catList=el('ul',{class:'cats'},Object.keys(cats).map(function(k){ var c=cats[k], p=Math.round(c.r/c.t*100);
        return el('li',{},[el('div',{class:'l'},[el('span',{text:k}),el('span',{text:c.r+' av '+c.t})]),el('div',{class:'bar'},[el('i',{style:'width:'+p+'%'})])]); }));
      var kids=[el('h2',{text:'Resultat'}),
        el('div',{style:'display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap'},[el('div',{class:'score',text:right+' / '+total}),el('div',{class:'muted',text:pct+' % riktig på første forsøk'})]),
        el('p',{text:msg}), el('h2',{text:'Per tema',style:'font-size:1.1rem'}), catList];
      if(missed.length){
        kids.push(el('h2',{text:'Dette bør du øve mer på',style:'font-size:1.1rem'}));
        kids.push(el('ul',{class:'miss'},missed.map(function(r){ var ans=r.q.answers.filter(function(a){return a.correct;})[0].text;
          return el('li',{},[el('b',{text:r.q.text}),el('span',{text:'Riktig svar: '+ans})]); })));
      }
      var again=el('button',{class:'btn',type:'button',text:'Ny test'}); again.onclick=start;
      var row=el('div',{class:'row'},[again]);
      if(missed.length){ var rep=el('button',{class:'btn ghost',type:'button',text:'Øv på feilene ('+missed.length+')'}); rep.onclick=function(){ run(draw(0,[],missed.map(function(r){return r.q.id;}))); }; row.appendChild(rep); }
      kids.push(row);
      mount(el('section',{class:'card',style:'display:flex;flex-direction:column;gap:1.1rem'},kids));
    }
    show();
  }

  // ---------- Tastatur: 1, 2, 3 velger svar ----------
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('input,textarea')) return;
    if(['1','2','3'].indexOf(e.key)>-1){ var b=document.querySelectorAll('.opt'); var t=b[+e.key-1]; if(t&&!t.disabled) t.click(); }
  });

  // ---------- Tema ----------
  document.getElementById('themeBtn').onclick=function(){
    var r=document.documentElement, dark=r.getAttribute('data-theme')==='dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    r.setAttribute('data-theme', dark?'light':'dark');
  };

  start();
})();
</script>
